<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient for modern look -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B9BD1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7BA7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Book with growth arrow -->
  <g transform="translate(10, 15)">
    <!-- Book -->
    <rect x="0" y="10" width="20" height="24" rx="2" fill="url(#logoGradient)"/>
    <rect x="2" y="12" width="16" height="20" rx="1" fill="#E8F4F8"/>
    <line x1="10" y1="12" x2="10" y2="32" stroke="url(#logoGradient)" stroke-width="1"/>
    
    <!-- Growth arrow -->
    <path d="M 15 20 L 25 10 L 25 15 M 25 10 L 20 10" stroke="#4A7BA7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Brand name -->
  <text x="45" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#2C5282">
    Dasa Ouhrabkova
  </text>
  <text x="45" y="42" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#6B9BD1">
    evolvo.cz
  </text>
</svg>
