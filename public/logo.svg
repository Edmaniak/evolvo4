<svg width="220" height="80" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="logoGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B4A5D5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C7E8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8C5A5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7FB8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#B4A5D5;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Lotus/Mandala inspired icon -->
  <g transform="translate(15, 20)">
    <!-- Outer petals -->
    <ellipse cx="20" cy="28" rx="8" ry="16" fill="url(#logoGradient1)" opacity="0.6" transform="rotate(-30 20 28)"/>
    <ellipse cx="20" cy="28" rx="8" ry="16" fill="url(#logoGradient1)" opacity="0.6" transform="rotate(30 20 28)"/>
    <ellipse cx="20" cy="28" rx="8" ry="16" fill="url(#logoGradient1)" opacity="0.7" transform="rotate(90 20 28)"/>
    
    <!-- Inner petals -->
    <ellipse cx="20" cy="28" rx="6" ry="12" fill="url(#logoGradient2)" opacity="0.7" transform="rotate(-15 20 28)"/>
    <ellipse cx="20" cy="28" rx="6" ry="12" fill="url(#logoGradient2)" opacity="0.7" transform="rotate(15 20 28)"/>
    <ellipse cx="20" cy="28" rx="6" ry="12" fill="url(#logoGradient2)" opacity="0.8" transform="rotate(45 20 28)"/>
    <ellipse cx="20" cy="28" rx="6" ry="12" fill="url(#logoGradient2)" opacity="0.8" transform="rotate(-45 20 28)"/>
    
    <!-- Center circle -->
    <circle cx="20" cy="28" r="6" fill="url(#logoGradient1)"/>
    <circle cx="20" cy="28" r="4" fill="#FFFEF9"/>
    <circle cx="20" cy="28" r="2" fill="#B4A5D5"/>
    
    <!-- Growth element - soft curve -->
    <path d="M 20 10 Q 28 15, 30 8" stroke="#8B7FB8" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
    <circle cx="30" cy="8" r="2.5" fill="#C7E8DC" opacity="0.8"/>
  </g>
  
  <!-- Brand name with personal touch -->
  <text x="60" y="32" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#4A4458" letter-spacing="1">
    Daša Ouhrabková
  </text>
  
  <!-- Tagline with softer color -->
  <text x="60" y="52" font-family="Georgia, serif" font-size="12" font-weight="300" fill="#8B8596" letter-spacing="0.5">
    evolvo.cz
  </text>
  
  <!-- Decorative element -->
  <line x1="60" y1="58" x2="140" y2="58" stroke="url(#logoGradient1)" stroke-width="1.5" opacity="0.4"/>
</svg>
